
<style>
/* AJUSTES DO MARCADOR DE TESTE */

/* Centralizar nome da ave */
#birdName {
  text-align: center !important;
}
#birdName::placeholder {
  text-align: center !important;
}

/* Evitar sobreposição dos botões */
.controls {
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr) !important;
  gap: 7px !important;
  height: auto !important;
  min-height: 190px !important;
  margin-bottom: 10px !important;
}
.controls-left {
  display: grid !important;
  grid-template-rows: 1fr 1fr !important;
  gap: 7px !important;
  min-width: 0 !important;
}
.control {
  min-width: 0 !important;
  min-height: 85px !important;
}
.tap {
  min-width: 0 !important;
  min-height: 190px !important;
  overflow: hidden !important;
}
.big-number {
  font-size: clamp(60px, 17vw, 130px) !important;
  max-width: 100% !important;
  overflow-wrap: anywhere !important;
}
.actions {
  position: relative !important;
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 8px !important;
  padding: 9px 7px !important;
}
.action {
  min-width: 0 !important;
  min-height: 65px !important;
  font-size: clamp(11px, 2.7vw, 18px) !important;
  overflow-wrap: anywhere !important;
}

/* Opções de 10 e 15 minutos */
.timer-arrows {
  display: none !important;
}
.timer-row {
  width: 100% !important;
}
.timer {
  width: 100% !important;
}
#opcoesTempo {
  display: flex;
  gap: 8px;
  padding: 10px 7px;
}
#opcoesTempo button {
  flex: 1;
  padding: 12px 5px;
  border: 2px solid #294253;
  border-radius: 10px;
  background: #13222d;
  color: white;
  font-weight: 900;
}
#opcoesTempo button.ativo {
  background: #ffca28;
  border-color: #ffca28;
  color: #071016;
}
#opcoesTempo button:disabled {
  opacity: .6;
}
</style>

<script>
/* Opções fixas de tempo */
(function () {
  const iniciar = () => {
    const painel = document.querySelector(".counter-layout");
    const timer = document.getElementById("time");
    const mais = document.getElementById("more");
    const menos = document.getElementById("less");

    if (!painel || !timer || !mais || !menos) return;

    const opcoes = document.createElement("div");
    opcoes.id = "opcoesTempo";
    opcoes.innerHTML =
      '<button id="tempo10">10 MIN</button>' +
      '<button id="tempo15" class="ativo">15 MIN</button>';

    painel.parentNode.insertBefore(opcoes, painel);

    let escolhido = 15;

    function atualizar() {
      document.getElementById("tempo10")
        .classList.toggle("ativo", escolhido === 10);
      document.getElementById("tempo15")
        .classList.toggle("ativo", escolhido === 15);
    }

    function escolher(valor) {
      if (mais.disabled || menos.disabled) return;

      let atual = parseInt(timer.textContent, 10);
      let diferenca = valor - atual;

      while (diferenca > 0) {
        mais.click();
        diferenca--;
      }
      while (diferenca < 0) {
        menos.click();
        diferenca++;
      }

      escolhido = valor;
      atualizar();
    }

    document.getElementById("tempo10").onclick =
      () => escolher(10);
    document.getElementById("tempo15").onclick =
      () => escolher(15);

    const observar = new MutationObserver(() => {
      const travado = mais.disabled || menos.disabled;
      document.getElementById("tempo10").disabled = travado;
      document.getElementById("tempo15").disabled = travado;
    });

    observar.observe(mais, {attributes: true});
    observar.observe(menos, {attributes: true});
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", iniciar);
  } else {
    iniciar();
  }
})();
</script>
